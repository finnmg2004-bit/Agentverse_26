[workspace]
name = "nudge"
version = "0.1.0"
description = "Nudge: Embodied quadruped assistance dog for deafblind owners (Agentverse 2026)"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tasks]
# Download YOLOv8n ONNX + YAMNet TFLite into assets/models/ and pull the local Gemma model via Ollama
fetch-models = "python scripts/fetch_models.py"

# Convert the scanned owner (Renderpeople OBJ in assets/models/, not committed) into a MuJoCo mesh
prepare-owner = "python scripts/prepare_owner.py"

# Re-split assets/lightbar/police_lights.glb into housing + lens meshes (outputs are committed)
prepare-lightbar = "python scripts/prepare_lightbar.py"

# Fetch the nerv-world house scene + its Unitree Go2 (git submodule, shallow, ~390 MB)
fetch-world = "git submodule update --init --depth 1 worlds/nerv-world"

# Headless check: layout coordinates vs the compiled house, doorways, and planner routes
check-world = { cmd = "python sim/check_world.py", depends-on = ["fetch-world"] }

# (Re)build the static navigation map cache (assets/maps/nerv_house_nav.npz); also built automatically
build-map = { cmd = "python sim/nav_map.py", depends-on = ["fetch-world"] }

# Simulator: nerv-world house + Go2 + owner/chair/beacons, hotkeys, ZMQ server (default / Windows)
sim = { cmd = "python sim/run_sim.py", depends-on = ["fetch-world"] }

# Run the Nudge Brain process (default / Windows)
brain = "python nudge-brain/main.py"

# Sim + brain together from ONE terminal; closing either window stops both.
# Extra options pass through, e.g. `pixi run start --view dog --noise tv`
start = { cmd = "python scripts/run_all.py", depends-on = ["fetch-world"] }

# Type an owner request into a running brain, e.g. `pixi run say take me to the kitchen` (same channel as a chat GUI)
say = "python scripts/say.py"

# End-to-end scenario tests (doorbell, knock, smoke, owner_moved, chair, reset, demo, voice_*); add --gui to watch
test-scenarios = { cmd = "python scripts/test_scenarios.py", depends-on = ["fetch-world"] }

[target.linux-64.tasks]
# Simulator (forces X11/GLFW compatibility on Linux Wayland/X11)
sim = { cmd = "python sim/run_sim.py", env = { MUJOCO_GL = "glfw", GDK_BACKEND = "x11" }, depends-on = ["fetch-world"] }

# Run the Nudge Brain process (perception, navigation, agent, safety, live dashboard)
brain = { cmd = "python nudge-brain/main.py", env = { GDK_BACKEND = "x11" } }

# Sim + brain together from one terminal (X11/GLFW env inherited by both child processes)
start = { cmd = "python scripts/run_all.py", env = { MUJOCO_GL = "glfw", GDK_BACKEND = "x11" }, depends-on = ["fetch-world"] }

[dependencies]
python = "3.11.*"
pip = ">=24.0"
numpy = ">=1.26,<2.0"
scipy = ">=1.12"
pyzmq = ">=25.1"
python-sounddevice = ">=0.5.6,<0.6"

[target.linux-64.dependencies]
# Linux GLFW / X11 / OpenGL runtime libs so MuJoCo viewer doesn't fail on missing .so files
glfw = ">=3.3"
libgl-devel = "*"

[pypi-dependencies]
mujoco = ">=3.1.6"
opencv-python = ">=4.9.0"
onnxruntime = ">=1.18"
ai-edge-litert = ">=1.2"
faster-whisper = ">=1.2.1, <2"
