[project]
name = "nudge"
version = "0.1.0"
description = "Nudge: Embodied quadruped assistance dog for deafblind owners (Agentverse 2026)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
# Clone Go2 model from MuJoCo Menagerie if not already present
fetch-go2 = """
bash -c 'if [ ! -d "mujoco_menagerie/unitree_go2" ]; then
  git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git &&
  cd mujoco_menagerie &&
  git sparse-checkout set unitree_go2;
else
  echo "unitree_go2 already present.";
fi'
"""

# Run the MuJoCo simulation viewer (forces X11/GLFW compatibility on Linux Wayland/X11)
sim = { cmd = "python sim/run_sim.py", env = { MUJOCO_GL = "glfw", GDK_BACKEND = "x11" } }

# Run the Nudge Brain process (perception, navigation, agent, safety, live dashboard)
brain = { cmd = "python nudge-brain/main.py", env = { GDK_BACKEND = "x11" } }

[dependencies]
python = "3.11.*"
pip = ">=24.0"
numpy = ">=1.26,<2.0"
scipy = ">=1.12"
pyzmq = ">=25.1"
# Linux GLFW / X11 / OpenGL runtime libs so MuJoCo viewer doesn't fail on missing .so files
glfw = ">=3.3"
libgl-devel = "*"

[pypi-dependencies]
mujoco = ">=3.1.6"
opencv-python = ">=4.9.0"
